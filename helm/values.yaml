# Default values = DEV / local cluster. Reproduces the live dclaw-core deployment:
# locally-built :local images (imagePullPolicy: Never), NodePort frontend, and the
# shared dclaw-shared-postgres database. Plain `helm install dclaw-monitor ./helm
# -n dclaw-core` brings the app up with no extra flags.
#
# For the cloud/GHCR deployment, override with: -f values-prod.yaml

nameOverride: ""

backend:
  enabled: true
  replicaCount: 1
  image:
    repository: docker.io/library/dclaw-monitor-backend
    tag: local
    pullPolicy: Never
  containerPort: 8030
  service:
    type: ClusterIP
    port: 8030
  env:
    OTEL_SERVICE_NAME: dclaw-monitor
    OTEL_EXPORTER_OTLP_ENDPOINT: http://clickstack-otel-collector.observability.svc.cluster.local:4318
    OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    OTEL_RESOURCE_ATTRIBUTES: k8s.namespace.name=dclaw-core,deployment.environment=production
    OTEL_TRACES_EXPORTER: otlp
    OTEL_METRICS_EXPORTER: otlp
    OTEL_LOGS_EXPORTER: otlp
  livenessProbe:
    path: /health/
    initialDelaySeconds: 15
    periodSeconds: 30
  readinessProbe:
    path: /health/
    initialDelaySeconds: 10
    periodSeconds: 10
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: docker.io/library/dclaw-monitor-frontend
    tag: local
    pullPolicy: Never
  containerPort: 3030
  service:
    type: NodePort
    port: 3030
    nodePort: 30030
  env:
    OTEL_SERVICE_NAME: dclaw-monitor-frontend
    OTEL_EXPORTER_OTLP_ENDPOINT: http://clickstack-otel-collector.observability.svc.cluster.local:4318
    OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    OTEL_RESOURCE_ATTRIBUTES: k8s.namespace.name=dclaw-core,deployment.environment=production
    OTEL_TRACES_EXPORTER: otlp
    OTEL_METRICS_EXPORTER: otlp
    OTEL_LOGS_EXPORTER: otlp
  readinessProbe:
    path: /
    initialDelaySeconds: 5
    periodSeconds: 10
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

secret:
  name: ""
  data:
    DATABASE_URL: postgresql+asyncpg://postgres:postgres@dclaw-shared-postgres:5432/dclaw_monitor
    APP_ENV: production
    SECRET_KEY: dclaw-monitor-local-secret-key

ingress:
  enabled: false
  className: nginx
  annotations: {}
  host: ""
  tls: []
