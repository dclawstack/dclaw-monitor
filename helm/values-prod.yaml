# Cloud / production overrides. Use with:
#   helm install dclaw-monitor ./helm -n <ns> -f values-prod.yaml

backend:
  image:
    repository: ghcr.io/dclawstack/dclaw-monitor-backend
    tag: latest
    pullPolicy: IfNotPresent

frontend:
  image:
    repository: ghcr.io/dclawstack/dclaw-monitor-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  host: monitor.dclawstack.io
  tls:
    - secretName: dclaw-monitor-tls
      hosts:
        - monitor.dclawstack.io
